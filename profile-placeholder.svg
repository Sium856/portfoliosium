<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1E26" />
      <stop offset="100%" stop-color="#101217" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2BE45" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)" stroke="#2D333F" stroke-width="2" />
  
  <!-- Subtle inner ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#C9A227" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Elegant Head & Shoulders Silhouette -->
  <g filter="url(#subtleGlow)">
    <!-- Head -->
    <ellipse cx="100" cy="74" rx="28" ry="34" fill="#242A35" stroke="#3A4354" stroke-width="1.5" />
    
    <!-- Hair hint -->
    <path d="M72 70 C72 46, 82 40, 100 40 C118 40, 128 46, 128 70 C124 55, 114 50, 100 50 C86 50, 76 55, 72 70 Z" fill="#181C24" />

    <!-- Shoulders / Suit Jacket -->
    <path d="M38 174 C40 134, 68 122, 100 122 C132 122, 160 134, 162 174 C140 184, 60 184, 38 174 Z" fill="#1B202A" stroke="#3A4354" stroke-width="1.5" />
    
    <!-- Shirt Collar & Tie Accent in Brass -->
    <polygon points="100,122 88,142 100,150 112,142" fill="#E6E9EE" opacity="0.9" />
    <polygon points="100,136 96,146 95,178 100,184 105,178 104,146" fill="url(#goldGrad)" />
  </g>

  <!-- Monogram Watermark -->
  <text x="100" y="104" font-family="'Fraunces', serif" font-size="20" font-weight="600" fill="#DFB738" text-anchor="middle" letter-spacing="2" opacity="0.85">JIS</text>
</svg>
